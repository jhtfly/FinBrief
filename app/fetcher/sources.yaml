  - key: eiopa
    name_cn: 欧洲保险与职业养老金管理局
    name_en: EIOPA
    category: ins
    mode: html
    config:
      list_url: https://www.eiopa.europa.eu/news-and-events/news_en
      item: .ecl-content-item, .view-content .views-row
