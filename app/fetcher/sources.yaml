      link: a
    note: 官网为脚本渲染且反爬，默认停用

  - key: goldman
    name_cn: 高盛（洞察）
    name_en: Goldman Sachs Insights
    category: cons
    mode: html
    config:
      list_url: https://www.goldmansachs.com/insights/
      link_regexp: "/insights/(articles|goldman-sachs-exchanges|the-markets|podcasts|videos)/[a-z0-9-]+"
      date_in_parent: true
      max_items: 30
    note: 实测可用；日期取自文章卡片父容器

  - key: mschina
    name_cn: 摩根士丹利中国（研究报告）
    name_en: Morgan Stanley China
    category: cons
    mode: html
    config:
      list_url: https://www.morganstanleychina.com/ideas
      item: .row-base
      title: a
      title_regexp: '^\S+\s+(.+?)\s+\d{4}年'
      link: a
      date_regexp: "\\d{4}年\\d{2}月\\d{2}日"
    note: 实测可用；中文站，更新频率低

  - key: jpmorgan
    name_cn: 摩根大通（新闻稿）
