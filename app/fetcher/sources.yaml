# 金融热点编译程序 预置信源配置（2026-10-24 实测逐站核验）
# mode: rss | html | sitemap
# 分类: cb_reg=国际金融监管/央行  ins=保险/养老监管  dep=存款保险  cons=咨询/评级/投行
# 标注"需代理"的站点为大陆直连 403/超时（反爬或网络原因），开启代理后可能恢复；
# 全部站点失败均记录原因并继续，不中断任务。

sources:
  # ---------- 国际金融监管 / 央行 ----------
  - key: fsb
    name_cn: 金融稳定理事会
    name_en: FSB
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.fsb.org/feed/
    note: 实测直连可用

  - key: bis_press
    name_cn: 国际清算银行（新闻稿）
    name_en: BIS Press Releases
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.bis.org/doclist/all_pressrels.rss
    note: BIS官方RSS，实测可用

  - key: bis_cbspeeches
    name_cn: 国际清算银行（央行行长演讲）
    name_en: BIS Central Bankers' Speeches
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.bis.org/doclist/cbspeeches.rss
    note: BIS官方RSS，实测可用；演讲类线索政策含量高

  - key: bis_mgmtspeeches
    name_cn: 国际清算银行（管理层演讲）
    name_en: BIS Management Speeches
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.bis.org/doclist/mgmtspeeches.rss
    note: BIS官方RSS，实测可用

  - key: imf
    name_cn: 国际货币基金组织
    name_en: IMF
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.imf.org/en/News/RSS?Language=ENG&category=ALL
    note: 大陆直连返回403（Akamai防护），需开启代理后使用

  - key: iosco
    name_cn: 国际证监会组织
    name_en: IOSCO
    category: cb_reg
    mode: html
    config:
      list_url: https://www.iosco.org/news/
      item: "li.news-item, article, .news-list li"
      link: a
    note: 大陆直连403，需代理；选择器待代理环境下校准

  - key: sec
    name_cn: 美国证交会
    name_en: SEC
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.sec.gov/news/pressreleases.rss
    note: 官方RSS，实测可用

  - key: esma
    name_cn: 欧洲证券与市场管理局
    name_en: ESMA
    category: cb_reg
    mode: html
    config:
      list_url: https://www.esma.europa.eu/press-news/esma-news
      item: .news-contentcard
      link: a
      date: .search-date
    note: 实测可用；日期格式 dd/mm/yyyy

  - key: boj
    name_cn: 日本银行
    name_en: Bank of Japan
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.boj.or.jp/en/rss/whatsnew.xml
    note: 官方全站更新RSS，实测可用（含统计类更新，由AI筛选过滤）

  - key: mas
    name_cn: 新加坡金融管理局
    name_en: MAS
    category: cb_reg
    mode: sitemap
    config:
      sitemap_url: https://www.mas.gov.sg/sitemap.xml
      include: "/news/(media-releases|speeches|statements|parliamentary-sitting|other-news)/2026/"
      date_from: url
      url_date_regexp: "/news/[a-z-]+/(\\d{4})/"
      max_items: 40
    note: 官网为脚本渲染，走sitemap；URL仅含年份故日期留空，需人工核对

  - key: finma
    name_cn: 瑞士金融市场监督管理局
    name_en: FINMA
    category: cb_reg
    mode: sitemap
    config:
      sitemap_url: https://www.finma.ch/en/sitemap.xml
      include: "/en/news/\\d{4}/\\d{2}/"
      date_from: lastmod
      max_items: 40
    note: 实测可用；sitemap含lastmod精确到日

  - key: worldbank
    name_cn: 世界银行集团
    name_en: World Bank Group
    category: cb_reg
    mode: html
    config:
      list_url: https://www.worldbank.org/en/news
      link_regexp: "/en/news/(press-release|speech|feature|statement|immersive-story)/\\d{4}/\\d{2}/\\d{2}/"
      url_date_regexp: "/(\\d{4})/(\\d{2})/(\\d{2})/"
      max_items: 40
    note: 实测可用；日期取自URL（精确到日）

  - key: ecb
    name_cn: 欧洲中央银行
    name_en: ECB
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.ecb.europa.eu/rss/press.html
    note: 官方RSS，实测可用

  - key: fed
    name_cn: 美联储
    name_en: Federal Reserve
    category: cb_reg
    mode: rss
    config:
      rss_url: https://www.federalreserve.gov/feeds/press_all.xml
    note: 官方RSS，实测可用

  - key: fca
    name_cn: 英国金融行为监管局
    name_en: FCA
    category: cb_reg
    mode: html
    config:
      list_url: https://www.fca.org.uk/news/news-stories
      item: .news-items article, .views-row
      link: a
      date: time
      date_attr: datetime
    note: 大陆直连403，需开启代理；选择器待代理环境校准

  - key: fdic
    name_cn: 美国联邦存款保险公司
    name_en: FDIC
    category: cb_reg
    mode: html
    config:
      list_url: https://www.fdic.gov/news/press-releases
      item: .views-row
      title: .news-title
      date: .news-date
    note: 实测可用

  - key: cdic
    name_cn: 加拿大存款保险公司
    name_en: CDIC
    category: dep
    mode: sitemap
    config:
      sitemap_url: https://www.cdic.ca/post-sitemap.xml
      include: "/(news|speeches|articles)/"
      date_from: lastmod
      max_items: 30
    note: 实测可用；站点更新频率低，时间窗内常无新内容属正常

  # ---------- 保险 / 养老监管 ----------
  - key: iais
