    note: 大陆直连403，需开启代理；选择器待代理环境校准

  # ---------- 存款保险 ----------
  - key: iadi
    name_cn: 国际存款保险协会
    name_en: IADI
    category: dep
    mode: html
    config:
      list_url: https://www.iadi.org/news-and-media/news/
      link_regexp: "iadi\\.org/\\d{4}/\\d{2}/[a-z0-9-]+/?$"
      max_items: 30
    note: 实测可用；URL仅含年月，日期留空需人工核对

  # ---------- 咨询 / 评级 / 投行 ----------
  - key: mckinsey
    name_cn: 麦肯锡（金融服务洞察）
